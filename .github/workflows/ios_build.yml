# ============================================================
# iOS 出包（未签名 IPA，Windows 上用 Sideloadly 签名装机）
# ------------------------------------------------------------
# 用法：
#   1. 放到仓库 .github/workflows/ios_build.yml
#   2. push 到 main/master 自动构建（与 Android APK 同步出包）
#   3. 也可在 GitHub Actions 页面手动 Run workflow
# 产物：Releases 页 ipa-<短sha> 附件 alexcnc_ios_unsigned.ipa
#       （Release 附件不占 artifact 存储配额，优先走这里）
# 注意：私有仓库 macOS 分钟数按 10 倍计费（免费额度 2000/月 ≈ 20 次）
# ============================================================
name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main, master]
    paths: ['lib/**','pubspec.yaml','pubspec.lock','android/**','ios/**','packages/**','assets/**','.github/workflows/**']
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter 版本自动读 pubspec.yaml 的 environment 声明，与 Android 侧保持一致
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # 仓库目前没有 ios/ 目录：首次运行用 Flutter 自动生成平台脚手架，
      # 并把部署目标抬高到 13.0（新版插件 network_info_plus 等的常见要求）
      - name: Bootstrap ios platform if missing
        run: |
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --project-name alexcnc
            echo "### IOS_BOOTSTRAP scaffold created"
          else
            echo "### IOS_BOOTSTRAP ios/ already present"
          fi
          sed -i '' -e 's/IPHONEOS_DEPLOYMENT_TARGET = 11\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' -e 's/IPHONEOS_DEPLOYMENT_TARGET = 12\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Pub get
        run: flutter pub get

      # DEBUG_TOOLS 与 build.yml 的 Android 注入口径一致
      #（收口：正式客户包前移除该 define 即自动隐藏调试模式）
      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=DEBUG_TOOLS=true

      # 未签名 .app 打包成 IPA（Payload 结构），供 Sideloadly 签名
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry alexcnc_ios_unsigned.ipa Payload
          echo "### IPA_DIAG size=$(stat -f %z alexcnc_ios_unsigned.ipa)"

      # 备份通道：配额(账户级,500MB)耗尽时失败不算错，交付靠下面的 Release
      - name: Upload IPA artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: alexcnc-ios-unsigned
          path: alexcnc_ios_unsigned.ipa
          retention-days: 7

      # 交付通道（幂等）：Release 附件不占 artifact 配额
      - name: Publish IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-${GITHUB_SHA::7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" alexcnc_ios_unsigned.ipa --clobber || echo "upload failed (non-fatal)"
          else
            gh release create "$TAG" alexcnc_ios_unsigned.ipa --title "iOS unsigned IPA ${GITHUB_SHA::7}" --notes "未签名 IPA，下载后用 Sideloadly 签名安装（7 天有效）" || echo "release create failed (non-fatal)"
          fi
