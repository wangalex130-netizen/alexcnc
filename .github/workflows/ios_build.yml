# ============================================================
# iOS 出包（未签名 IPA，Windows 上用 Sideloadly 签名装机）
# ------------------------------------------------------------
# v2（2026-09-29）：
#   - Flutter 固定 3.29.0，与 build.yml 的 Android 构建同版本
#   - iOS 平台脚手架每次现场生成（不提交回仓库），沿用 build.yml
#     注释掉的既定方案：org com.alexcnc + main.dart/pubspec 备份恢复
#     + Info.plist 局域网权限（连机器/摄像头必需）
#   - dart-define 注入口径与 Android push 构建对齐
#   - 交付走 Release（不占 artifact 配额）；artifact 仅备份、失败不阻断
# 注意：私有仓库 macOS 分钟数按 10 倍计费（免费额度 2000/月 ≈ 20 次）
# ============================================================
name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main, master]
    paths: ['lib/**','pubspec.yaml','pubspec.lock','android/**','ios/**','packages/**','assets/**','.github/workflows/**']
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 环境诊断：Xcode 版本 + Swift overlay 库实际位置（一次跑清，避免盲试）
      - name: Diagnose Xcode / Swift overlays
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          TC="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          echo "### toolchain=$TC"
          echo "### find libswift_Builtin_float:"
          find "$(xcode-select -p)" -name 'libswift_Builtin_float*' 2>/dev/null || true
          echo "### find libswift_errno:"
          find "$(xcode-select -p)" -name 'libswift_errno*' 2>/dev/null || true
          echo "### SDK usr/lib/swift:"
          ls "$(xcrun --show-sdk-path)/usr/lib/swift" 2>/dev/null | head -20 || true
          echo "### done"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # 沿用 build.yml 注释方案的既定口径：备份入口文件 → 生成 iOS 脚手架 → 恢复
      - name: Generate iOS platform
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --platforms=ios --org com.alexcnc .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # 部署目标抬到 13.0（network_info_plus 等新版插件的常见最低要求）
          sed -i '' -e 's/IPHONEOS_DEPLOYMENT_TARGET = 11\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' -e 's/IPHONEOS_DEPLOYMENT_TARGET = 12\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj || true

      # 局域网发现/连接权限（App 连雕刻机与摄像头必需），grep 守卫保证幂等
      - name: Inject iOS network permissions (Info.plist)
        run: |
          PLIST=ios/Runner/Info.plist
          grep -q NSLocalNetworkUsageDescription "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string '用于发现并连接局域网内的 CNC 雕刻机与摄像头'" "$PLIST"
          grep -q NSBonjourServices "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$PLIST" | grep -q _alexcnc._tcp || /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _alexcnc._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$PLIST" | grep -q _http._tcp || /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string _http._tcp" "$PLIST"
          grep -q NSAppTransportSecurity "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST" | grep -q NSAllowsArbitraryLoads || /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Pub get
        run: flutter pub get

      # Swift 运行库 overlay 链接修复：Xcode 16.3+ 下 Flutter 3.29 模板链接
      # Runner 时找不到 swift_Builtin_float/errno/math 等 overlay tbd，
      # 显式补 -lswift_* + 工具链 Swift 库路径 + Always Embed Swift。
      # 锚点为 Runner 的 bundle id（3 个 build configuration 各一处）。
      - name: Patch Runner link settings (Swift overlay libs)
        run: |
          python3 - << 'PYEOF'
          import io
          p = "ios/Runner.xcodeproj/project.pbxproj"
          s = io.open(p, encoding="utf-8").read()
          anchor = "PRODUCT_BUNDLE_IDENTIFIER = com.alexcnc.alexcnc;"
          inject = ('OTHER_LDFLAGS = "$(inherited) -lswift_Builtin_float -lswift_errno -lswift_math -lswift_signal -lswift_stdio -lswift_time -lswiftsys_time -lswiftunistd";\n'
                    '\t\t\t\tLIBRARY_SEARCH_PATHS = "$(inherited) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift_static/$(PLATFORM_NAME)";\n'
                    '\t\t\t\tLD_ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;')
          n = s.count(anchor)
          print("### PATCH anchor count =", n)
          if n == 0:
              raise SystemExit("patch anchor not found - template changed?")
          if "libswiftunistd" not in s:
              s = s.replace(anchor, anchor + "\n\t\t\t\t" + inject)
              io.open(p, "w", encoding="utf-8", newline="").write(s)
              print("### PATCH applied to", n, "configurations")
          else:
              print("### PATCH already present, skip")
          PYEOF

      # dart-define 注入口径与 build.yml 的 Android push 构建一致（值不落仓库）
      - name: Build iOS (no codesign)
        env:
          LAB_MQTT_USER: ${{ secrets.LAB_MQTT_USER }}
          LAB_MQTT_PASS: ${{ secrets.LAB_MQTT_PASS }}
          LAB_CAMERA_USER: ${{ secrets.LAB_CAMERA_USER }}
          LAB_CAMERA_PASS: ${{ secrets.LAB_CAMERA_PASS }}
          LAB_RELAY_TOKEN: ${{ secrets.LAB_RELAY_TOKEN }}
        run: |
          DEFINE_ARGS="--dart-define=MQTT_ALLOW_SELF_SIGNED=true --dart-define=DEBUG_TOOLS=true"
          if [ -n "${LAB_MQTT_USER}" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=MQTT_USER=${LAB_MQTT_USER}"; fi
          if [ -n "${LAB_MQTT_PASS}" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=MQTT_PASS=${LAB_MQTT_PASS}"; fi
          if [ -n "${LAB_CAMERA_USER}" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=CAMERA_USER=${LAB_CAMERA_USER}"; fi
          if [ -n "${LAB_CAMERA_PASS}" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=CAMERA_PASS=${LAB_CAMERA_PASS}"; fi
          if [ -n "${LAB_RELAY_TOKEN}" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=CAMERA_RELAY_TOKEN=${LAB_RELAY_TOKEN}"; fi
          APP_LINE="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')"
          APP_VER="${APP_LINE%%+*}"
          APP_BUILD="0"
          case "$APP_LINE" in
            *+*) APP_BUILD="${APP_LINE##*+}" ;;
          esac
          case "$APP_BUILD" in
            ''|*[!0-9]*) APP_BUILD=0 ;;
          esac
          SHA_SHORT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          DEFINE_ARGS="$DEFINE_ARGS --dart-define=APP_VERSION=${APP_VER} --dart-define=APP_BUILD_NUMBER=${APP_BUILD} --dart-define=BUILD_SHA=${SHA_SHORT}"
          echo "### DEFINE_KEYS: $(printf '%s' "$DEFINE_ARGS" | tr ' ' '\n' | sed 's/^--dart-define=//' | sed 's/=.*//' | tr '\n' ' ')"
          flutter build ios --release --no-codesign $DEFINE_ARGS

      # 未签名 .app 打包成 IPA（Payload 结构），供 Sideloadly 签名
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry alexcnc-ios-unsigned.ipa Payload
          echo "### IPA_DIAG size=$(stat -f %z alexcnc-ios-unsigned.ipa)"

      # 备份通道：配额(账户级,500MB)耗尽时失败不算错，交付靠下面的 Release
      - name: Upload IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: alexcnc-ios-unsigned
          path: build/ios/iphoneos/alexcnc-ios-unsigned.ipa
          retention-days: 7

      # 交付通道（幂等）：Release 附件不占 artifact 配额
      - name: Publish IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-${GITHUB_SHA::7}"
          IPA=build/ios/iphoneos/alexcnc-ios-unsigned.ipa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber || echo "upload failed (non-fatal)"
          else
            gh release create "$TAG" "$IPA" --title "iOS unsigned IPA ${GITHUB_SHA::7}" --notes "未签名 IPA，下载后用 Sideloadly 签名安装（7 天有效）" || echo "release create failed (non-fatal)"
          fi
