name: Build alexcnc (APK + IPA)



on:

  push:

    branches: [main, master]

    # 只在「会影响产物」的路径变动时构建。
    # 纯文档（docs/**、ci-log.txt）提交不再触发完整 APK 构建，
    # 避免每次写文档都白烧一次 Actions 分钟数。
    # 需要强制构建时用 workflow_dispatch（手动触发不看 paths）。
    paths:

      - 'lib/**'

      - 'pubspec.yaml'

      - 'pubspec.lock'

      - 'android/**'

      - 'ios/**'

      - 'packages/**'

      - 'assets/**'

      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      lab_build:
        description: '内部联调包：注入实验室凭据（放行自签 Broker 证书等）。正式包/客户包不要勾。'
        type: boolean
        default: false



jobs:

  build:

    runs-on: ubuntu-latest

    permissions:

      contents: write

    steps:

      - uses: actions/checkout@v4



      - name: Setup Java (Zulu 17)

        uses: actions/setup-java@v4

        with:

          distribution: 'zulu'

          java-version: '17'



      - name: Setup Flutter (stable)

        uses: subosito/flutter-action@v2

        with:

          flutter-version: '3.29.0'

          channel: 'stable'



      # ------------------------------------------------------------------

      # android/ 只在「仓库里还没有」时生成一次，生成完会在最后一步提交回仓库。

      # 从此以后 AGP / Gradle / Kotlin / minSdk / 权限全部是仓库里的可见文件，

      # 不再每次现场生成 + sed 打补丁 —— 这是过去反复盲调的根源。

      # ------------------------------------------------------------------

      - name: Generate Android platform (first time only)

        run: |

          if [ -d android ]; then

            echo "android/ already committed - skip generation"

            exit 0

          fi

          echo "android/ missing - generating once"

          cp lib/main.dart /tmp/main.dart.bak

          cp pubspec.yaml /tmp/pubspec.yaml.bak

          flutter create --platforms=android --org com.alexcnc .

          cp /tmp/main.dart.bak lib/main.dart

          cp /tmp/pubspec.yaml.bak pubspec.yaml

          rm -rf test



          # libVLC (libvlc-all 3.6.4) 要求 minSdk >= 24

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts



          MANIFEST=android/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \

            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"

          grep -q 'CHANGE_WIFI_MULTICAST_STATE' "$MANIFEST" || \

            sed -i 's#<application#<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <application#' "$MANIFEST"

          grep -q 'ACCESS_WIFI_STATE' "$MANIFEST" || \

            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <application#' "$MANIFEST"

          grep -q 'ACCESS_NETWORK_STATE' "$MANIFEST" || \

            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' "$MANIFEST"

          grep -q 'usesCleartextTraffic' "$MANIFEST" || \

            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"



      # ------------------------------------------------------------------

      # 关键：这一步永远返回 0，把 pub get / analyze / build 的完整输出写进

      # ci-log.txt。真正的成败通过 step output 传给后面的 "Fail if build failed"。

      # 这样即使构建挂了，下一步的「日志写回仓库」也一定会执行。

      # ------------------------------------------------------------------

      - name: Build APK (capture full log)

        id: build

        env:
          # 内部联调包开关与实验室凭据（全部来自 Secrets，不进仓库）。
          # 不勾 lab_build 时这些值为空 → 不注入任何 dart-define → 与正式包一致。
          LAB_BUILD: ${{ github.event.inputs.lab_build }}
          LAB_MQTT_USER: ${{ secrets.LAB_MQTT_USER }}
          LAB_MQTT_PASS: ${{ secrets.LAB_MQTT_PASS }}
          LAB_CAMERA_USER: ${{ secrets.LAB_CAMERA_USER }}
          LAB_CAMERA_PASS: ${{ secrets.LAB_CAMERA_PASS }}
          LAB_RELAY_TOKEN: ${{ secrets.LAB_RELAY_TOKEN }}

        run: |

          set +e

          LOG=/tmp/ci.log

          : > "$LOG"



          echo "=== flutter --version ===" >> "$LOG"

          flutter --version >> "$LOG" 2>&1



          echo "" >> "$LOG"

          echo "=== tree: packages/ ===" >> "$LOG"

          find packages -type f | sort >> "$LOG" 2>&1



          echo "" >> "$LOG"

          echo "=== flutter pub get ===" >> "$LOG"

          flutter pub get >> "$LOG" 2>&1

          PUB=$?

          echo "### pub get exit=$PUB" >> "$LOG"



          BUILD=99

          if [ "$PUB" -eq 0 ]; then

            echo "" >> "$LOG"

            echo "=== .flutter-plugins-dependencies ===" >> "$LOG"

            cat .flutter-plugins-dependencies >> "$LOG" 2>&1



            echo "" >> "$LOG"

            # 内部联调包：按需注入实验室凭据（默认不注入）。
            # 只在对应 Secret 非空时才注入该 dart-define —— 传空串会覆盖 AppConfig
            # 的 defaultValue（String.fromEnvironment 只在"未提供"时才回默认值）。
            DEFINE_ARGS=""
            if [ "${LAB_BUILD}" = "true" ]; then
              DEFINE_ARGS="--dart-define=MQTT_ALLOW_SELF_SIGNED=true"
              if [ -n "${LAB_MQTT_USER}" ]; then
                DEFINE_ARGS="$DEFINE_ARGS --dart-define=MQTT_USER=${LAB_MQTT_USER}"
              fi
              if [ -n "${LAB_MQTT_PASS}" ]; then
                DEFINE_ARGS="$DEFINE_ARGS --dart-define=MQTT_PASS=${LAB_MQTT_PASS}"
              fi
              if [ -n "${LAB_CAMERA_USER}" ]; then
                DEFINE_ARGS="$DEFINE_ARGS --dart-define=CAMERA_USER=${LAB_CAMERA_USER}"
              fi
              if [ -n "${LAB_CAMERA_PASS}" ]; then
                DEFINE_ARGS="$DEFINE_ARGS --dart-define=CAMERA_PASS=${LAB_CAMERA_PASS}"
              fi
              if [ -n "${LAB_RELAY_TOKEN}" ]; then
                DEFINE_ARGS="$DEFINE_ARGS --dart-define=CAMERA_RELAY_TOKEN=${LAB_RELAY_TOKEN}"
              fi
              echo "### LAB BUILD: dart-define injected (values hidden)" >> "$LOG"
            fi

            # 版本号（2026-09-10）：从 pubspec.yaml 读取并注入，供更新检查接口
            # (POST /api/app/updates/check) 上报当前版本。**固定注入（非联调专属）**，
            # 保证 App 自查更新时上报的版本与安装包一致，无需手工维护两份。
            # ⚠️ 必须 tr -d '\r'：pubspec.yaml 是 CRLF，而 CI 是 Linux ——
            # GNU grep 会把行尾的 \r 一起带出来，导致构建号的数字校验失败被兜底成 0。
            APP_LINE="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')"
            APP_VER="${APP_LINE%%+*}"
            APP_BUILD="0"
            case "$APP_LINE" in
              *+*) APP_BUILD="${APP_LINE##*+}" ;;
            esac
            case "$APP_BUILD" in
              ''|*[!0-9]*) APP_BUILD=0 ;;
            esac
            if [ -n "$APP_VER" ]; then
              DEFINE_ARGS="$DEFINE_ARGS --dart-define=APP_VERSION=${APP_VER} --dart-define=APP_BUILD_NUMBER=${APP_BUILD}"
            fi
            echo "### APP_VER_DIAG version='${APP_VER}' build='${APP_BUILD}'"

            # 诊断（2026-09-10）：把「联调包到底有没有注入凭据」变成可观测事实。
            # 只打印开关状态与长度，绝不打印值 —— Actions 日志是公开可见的。
            echo "### LAB_DIAG lab_build='${LAB_BUILD}' mqttUserLen=${#LAB_MQTT_USER} mqttPassLen=${#LAB_MQTT_PASS} camUserLen=${#LAB_CAMERA_USER} camPassLen=${#LAB_CAMERA_PASS} relayLen=${#LAB_RELAY_TOKEN}"
            echo "### LAB_DIAG define_keys: $(printf '%s' "$DEFINE_ARGS" | tr ' ' '\n' | sed 's/^--dart-define=//' | sed 's/=.*//' | tr '\n' ' ')"

            echo "" >> "$LOG"

            echo "=== flutter test（诊断用，非阻塞）===" >> "$LOG"

            flutter test >> "$LOG" 2>&1

            echo "### flutter test exit=$?" >> "$LOG"

            echo "" >> "$LOG"

            echo "=== flutter build apk --release ===" >> "$LOG"

            flutter build apk --release --verbose $DEFINE_ARGS >> "$LOG" 2>&1

            BUILD=$?

          fi

          echo "### build exit=$BUILD" >> "$LOG"

          # APK 指纹（2026-09-10）：判断「联调包 vs 正式包」是否真的不同，
          # 免得为了确认差异去下载 130MB。只打印大小与前 16 位哈希。
          if [ "$BUILD" = "0" ]; then
            APKP=build/app/outputs/flutter-apk/app-release.apk
            if [ -f "$APKP" ]; then
              echo "### APK_DIAG size=$(stat -c %s "$APKP") sha16=$(sha256sum "$APKP" | cut -c1-16)"
            fi
          fi


          # 只保留尾部 200KB，避免超出 GitHub 单文件展示限制

          tail -c 200000 "$LOG" > ci-log.txt

          echo "code=$BUILD" >> "$GITHUB_OUTPUT"

          echo "----- last 60 lines -----"

          tail -n 60 "$LOG"

          exit 0



      # ------------------------------------------------------------------

      # 把「生成好的 android/ 工程」和「完整构建日志」提交回仓库。

      # [skip ci] 防止触发新一轮构建造成死循环。

      # ------------------------------------------------------------------

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-log.txt
          if-no-files-found: warn



      - name: Upload APK artifact

        # 2026-09-04 二次修：outcome 会被 build 步骤的 set +e 骗成 success
        # （失败被吞、步骤仍 exit 0）。真正可信的是 build 步骤写出的
        # outputs.code（echo "code=$BUILD" >> $GITHUB_OUTPUT）。
        if: steps.build.outputs.code == '0'

        uses: actions/upload-artifact@v4

        with:

          name: alexcnc-app

          path: build/app/outputs/flutter-apk/app-release.apk



      - name: Publish APK release

        if: steps.build.outputs.code == '0'

        run: |

          # 幂等：同一 sha 重跑（或重复触发）时 tag 已存在，
          # 原写法 `gh release create` 会因 "tag already exists" 非零退出，
          # 把整个 job 标红 —— 而构建和产物其实都是好的。
          # 这里改为：已存在则只覆盖上传 asset，且失败不阻断 job。

          # 内部联调包用独立 tag（apk-lab-<sha>）：同一 commit 上普通构建与联调构建
          # 会撞 tag，导致联调包被普通包覆盖（或反过来），无法区分下载。
          if [ "${LAB_BUILD}" = "true" ]; then
            TAG="apk-lab-${{ github.sha }}"
          else
            TAG="apk-${{ github.sha }}"
          fi
          echo "RELEASE_TAG=$TAG"

          APK=build/app/outputs/flutter-apk/app-release.apk

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "release $TAG already exists - upload with --clobber"

            gh release upload "$TAG" "$APK" --clobber || echo "upload failed (non-fatal)"

          else

            gh release create "$TAG" "$APK" --title "Smart CNC Pro APK" --notes "Automated build from ${{ github.sha }}" || echo "release create failed (non-fatal)"

          fi

        env:

          GH_TOKEN: ${{ github.token }}

          LAB_BUILD: ${{ github.event.inputs.lab_build }}



      - name: Fail if build failed

        # 2026-09-04 修：outcome 被 set +e 永远骗成 success → 守卫从未生效。
        # 改读 build 步骤真实写出的 outputs.code。
        if: steps.build.outputs.code != '0'

        run: |

          echo "Build failed (code=${{ steps.build.outputs.code }})."

          echo "Full build log available in the 'ci-build-log' artifact."

          exit 1



  # iOS 构建暂时关闭（省 GitHub Actions 分钟数；macOS runner 按 10 倍扣额）。

