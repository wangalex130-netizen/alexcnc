name: Build alexcnc APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      # flutter create overwrites lib/main.dart and pubspec.yaml, so back them
      # up. The Android platform folder is generated here (no committed native
      # glue needed) — this is what makes a lean repo actually build an APK.
      - name: Backup custom entry files
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.alexcnc .

      - name: Restore custom entry files
        run: |
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      # Remove the default counter-app test so `flutter analyze` stays clean.
      - name: Drop generated default test
        run: rm -rf test

      - name: Install dependencies
        run: flutter pub get

      # Non-fatal: surface lint issues without blocking the first APK.
      - name: Analyze (advisory)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alexcnc-app
          path: build/app/outputs/flutter-apk/app-release.apk
