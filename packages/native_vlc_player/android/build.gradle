group 'com.alexcnc.native_vlc_player'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.alexcnc.native_vlc_player'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 24
    }
}

dependencies {
    // libVLC 3.6.4：对国产摄像头 RTSP over TCP 兼容性最好，且错误收敛在 native 层。
    implementation 'org.videolan.android:libvlc-all:3.6.4'
}
