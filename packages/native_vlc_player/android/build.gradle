group = 'com.alexcnc.native_vlc_player'
version = '0.1.0'

// 注意：这里【不能】再声明自己的 buildscript { classpath kotlin-gradle-plugin }。
// Flutter 3.29 生成的 android/settings.gradle.kts 已经用
//   plugins { id("com.android.application") version ... apply false
//             id("org.jetbrains.kotlin.android") version ... apply false }
// 把 AGP 和 Kotlin 插件放到了所有子工程的 classpath 上。
// 子工程再引入一份不同版本的 KGP 会导致 Kotlin plugin 被重复加载 / 版本冲突。
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.alexcnc.native_vlc_player'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // libvlc-all 3.6.4 要求 minSdk >= 24
        minSdk 24
    }
}

dependencies {
    // libVLC 3.6.4：对国产摄像头 RTSP over TCP 兼容性最好，错误收敛在 native 层，
    // 不会像 Media3 那样在网络线程直接把进程拖崩。与 camera-test-app 完全一致。
    implementation 'org.videolan.android:libvlc-all:3.6.4'
}
