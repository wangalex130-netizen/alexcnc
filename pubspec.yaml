name: alexcnc
description: Smart CNC Pro - Android client for ESP32 / modified-Grbl CNC machines.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  material_symbols_icons: ^4.2960.0
  # 摄像头实时监控：不再使用 flutter_vlc_player（反复出现 LateInitializationError
  # on _viewId）。改用本地 plugin，直接嵌入原生 libVLC 的 VLCVideoLayout，与
  # camera-test-app 完全一致。
  native_vlc_player:
    path: packages/native_vlc_player
  # 拿当前 Wi-Fi IP（走 Android 原生 WifiManager，比 NetworkInterface.list()
  # 可靠——后者可能拿到蜂窝网卡导致扫描错网段找不到摄像头）
  network_info_plus: ^6.1.0
  mqtt_client: 10.5.0
  http: ^1.2.0
  # 实时预览生命周期：检测控件是否可见，切走页面时自动暂停，切回时恢复，
  # 根治切换 tab 时的画面滞留与后台解码卡顿。
  visibility_detector: ^0.4.0+2
  path_provider: ^2.1.3
  # 外网 MJPEG 截图：把当前帧直接保存到系统相册（避免「保存后找不到文件」）。
  # 用维护版 image_gallery_saver_plus 取代已停更、与 AGP 8.x 不兼容的 image_gallery_saver。
  # 锁 ^4.0.1：5.x 要求 Dart>=3.9.2，而 CI 用 Flutter 3.29.0（Dart 3.7）装不上。
  image_gallery_saver_plus: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/karva_logo.png
